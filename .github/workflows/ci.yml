name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: npm run trace
      - run: npm test
      # generate_context! needs the built frontend (frontendDist) to exist.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: runner.os == 'Windows'
      # The X11 tests (spec 08) take over the clipboard and press keys, so they get an X server of their own.
      - run: CURSORA_XVFB=1 xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml
        if: runner.os == 'Linux'

  # Publishes to the public cursora-releases repo, as a draft; the code stays here (UPD-3.1, 3.2).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: node scripts/release-version.mjs "${{ github.ref_name }}" # UPD-3.4
      # The built-in engine (LLM-3.1): pinned llama.cpp build, checked against its SHA-256.
      - run: npm run fetch-llama
      # shortcut: both OSes find or create the draft; one finishing seconds after the other has been fine, but a tie
      # could make two drafts (delete one). Add a job that creates the draft first if it happens.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }} # contents: write on cursora-releases only
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }} # UPD-3.3
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: priyansh1210
          repo: cursora-releases
          # The tag is made there, on its own main: this repo's commits don't exist in it.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Cursora ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --config src-tauri/tauri.llama.conf.json
