[package]
name = "cursora"
version = "0.1.0"
description = "AI cursor companion"
authors = ["Priyansh Kabra"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cursora_lib"
# Desktop only: the staticlib and cdylib outputs are for iOS and Android, and cost about 1 GB and a slow link per build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
auto-launch = "0.6"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "json"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
keyring-core = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-openssl"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["std"] }
windows-native-keyring-store = "1"
# Same version Tauri already compiles, so this only adds features.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# This PC has 8 GB of RAM: with full debug info for every dependency, linking stalled for 15 minutes at a time.
[profile.dev]
debug = "line-tables-only"
